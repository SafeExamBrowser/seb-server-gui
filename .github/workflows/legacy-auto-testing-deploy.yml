# LEGACY: see .github/legacy/README.md.
# Pushing the git tag auto-testing-deploy builds sebadmin/seb-server-gui-auto-testing
# (plus its -single-host variant) and pushes both to Docker Hub. It deploys nothing
# itself. The same tag push also triggers legacy-tag-build.yml.
# Kept until the new pipeline is complete, then deleted. Formerly auto-test-deploy.yml
# ("Build and Deploy to Ralphina Server"). Its e2e-runner job was removed together
# with client/Dockerfile.e2e; that build had been failing since 24 Jun 2026.
name: "Legacy · auto-testing-deploy tag → Docker Hub"
on:
  workflow_dispatch:
  push:
    tags:
      - "auto-testing-deploy"

jobs:
  shai-hulud-detector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout seb-server-gui repo
        uses: actions/checkout@v7.0.1
        with:
          path: seb
          clean: false
      - name: Checkout Cobenian/shai-hulud-detect
        uses: actions/checkout@v7.0.1
        with:
          repository: Cobenian/shai-hulud-detect
          path: hulud
          clean: false
      - # Pipeline will automatically fail on exit codes 1 or 2
        name: Security Scan with Shai-Hulud Detector
        run: |
          chmod +x ./hulud/shai-hulud-detector.sh
          ./hulud/shai-hulud-detector.sh ./seb

  build-and-push-admin-auto-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag_suffix: ["", "-single-host"]
        include:
          - tag_suffix: ""
            path_name: ""
          - tag_suffix: "-single-host"
            path_name: "/seb-server-gui"

    steps:
      - name: Set env for dynamic tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: echo "TAG_NAME=${GITHUB_REF#refs/*/}${{ matrix.tag_suffix }}" >> $GITHUB_ENV

      - name: Set env manual
        if: github.event_name == 'workflow_dispatch'
        run: echo "TAG_NAME=default_version${{ matrix.tag_suffix }}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Login to DockerHub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_ADMIN_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ADMIN_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_ADMIN_USERNAME }}/seb-server-gui-auto-testing:${{ env.TAG_NAME }}
